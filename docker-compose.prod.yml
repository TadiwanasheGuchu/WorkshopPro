# Production overrides: HTTPS at the edge, nothing else published, no Mailpit.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env so plain
# `docker compose ...` commands (and the backup/deploy scripts) use both files.
# Requires in .env: ENVIRONMENT=production, SERVER_NAME, APP_BASE_URL=https://SERVER_NAME,
# CORS_ALLOWED_ORIGINS=https://SERVER_NAME, real SMTP_* and secrets. The API refuses to
# start in production with unsafe settings. See docs/deployment/installation.md.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mailpit:
    profiles: ["dev-mail"]  # not started in production

  nginx:
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
    volumes: !override
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ${TLS_CERT_DIR:-./infrastructure/certs}:/etc/nginx/certs:ro
      - acme-webroot:/var/www/acme:ro
    # Reload every 6 hours so renewed certificates are picked up without downtime.
    command:
      - /bin/sh
      - -c
      - "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

  # Let's Encrypt renewal, for servers reachable from the internet on port 80.
  # Enable with: docker compose --profile letsencrypt up -d (first certificate:
  # docs/deployment/installation.md). Not needed with customer-provided certificates.
  certbot:
    image: certbot/certbot:v3.1.0
    profiles: ["letsencrypt"]
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME in .env}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM;
        while :; do
        certbot renew --webroot -w /var/www/acme --quiet
        --deploy-hook "cp -L /etc/letsencrypt/live/$$SERVER_NAME/fullchain.pem /etc/letsencrypt/live/$$SERVER_NAME/privkey.pem /certs/";
        sleep 12h & wait $$!;
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
      - ${TLS_CERT_DIR:-./infrastructure/certs}:/certs

volumes:
  acme-webroot:
  letsencrypt:
