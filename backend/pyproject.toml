[project]
name = "workshoppro-backend"
version = "0.1.0"
description = "WorkshopPro API — automotive workshop management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=25.1",
    "email-validator>=2.2",
    "boto3>=1.35",
    "pillow>=11",
    "python-multipart>=0.0.18",
    "reportlab>=4.2",
    "celery[redis]>=5.4",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pypdf>=5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "DTZ", "PT"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a reachable PostgreSQL database (DATABASE_URL)",
]
