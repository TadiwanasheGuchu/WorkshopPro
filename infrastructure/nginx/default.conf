# WorkshopPro edge proxy.
#
# - /api/*  -> FastAPI backend (directly, no Next.js hop)
# - else    -> Next.js frontend
#
# This is the trust boundary for client IP addresses: X-Forwarded-For is OVERWRITTEN
# with the real peer address, so clients cannot spoof their IP to evade rate limits or
# falsify audit records. The backend trusts X-Forwarded-For only because it is not
# reachable except through this proxy (see docker-compose.yml).
#
# Production uses templates/production.conf.template (HTTPS) via docker-compose.prod.yml.

server_tokens off;

# Re-resolve service names through Docker's DNS, so recreating the backend or frontend
# container (e.g. during an update) does not leave nginx pointing at a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
    }

    location / {
        set $web http://frontend:3000;
        proxy_pass $web;
    }
}
