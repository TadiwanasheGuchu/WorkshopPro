# WorkshopPro edge proxy.
#
# - /api/*  -> FastAPI backend (directly, no Next.js hop)
# - else    -> Next.js frontend
#
# This is the trust boundary for client IP addresses: X-Forwarded-For is OVERWRITTEN
# with the real peer address, so clients cannot spoof their IP to evade rate limits or
# falsify audit records. The backend trusts X-Forwarded-For only because it is not
# reachable except through this proxy (see docker-compose.yml).
#
# TLS termination is added for production deployments (docs/deployment).

server_tokens off;

upstream workshoppro_api { server backend:8000; }
upstream workshoppro_web { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://workshoppro_api;
    }

    location / {
        proxy_pass http://workshoppro_web;
    }
}
